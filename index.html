<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>TABELION — El espacio inteligente del escribano Uruguayo</title>
    <meta name="description" content="TABELION: El espacio inteligente del escribano Uruguayo. Contrastación con Manual de Calificación DGR, auditoría documental en segundos y liquidación exacta de impuestos." />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tabelion" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon-tabelion.svg" />
    <link rel="apple-touch-icon" href="/icon-tabelion.svg" />
  </head>
  <body class="bg-[#09090b] text-slate-100 antialiased selection:bg-amber-500/25">
    <div id="root"></div>
    <script>
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            if (name.includes('striker-hub-cache-v1')) {
              caches.delete(name);
            }
          }
        });
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('Service Worker TABELION activo:', reg.scope))
            .catch((err) => console.warn('SW info:', err));
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
