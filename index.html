<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Striker Hub - Copiloto ELO Notarial</title>
    <meta name="description" content="Copiloto de alta precisión con inteligencia artificial ELO para escribanos y abogados en Uruguay." />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=Striker+Hub&background=2563eb&color=fff&size=192" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Limpieza preventiva de caché corrupta del Service Worker en entorno de desarrollo
      if ('caches' in window) {
        caches.keys().then((names) => {
          for (const name of names) {
            if (name.includes('striker-hub-cache-v1')) {
              caches.delete(name);
            }
          }
        });
      }
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            for (const reg of regs) {
              reg.unregister();
            }
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
              .catch((err) => console.error('Fallo al registrar el Service Worker:', err));
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
